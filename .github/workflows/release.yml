# Push a tag like v4.0.1 to build the addon zip, create the GitHub release
# and upload the file to CurseForge (project 1447095, from the TOC).
#
# Needs one repository secret: CF_API_TOKEN, a CurseForge API token from
# https://authors.curseforge.com/#/settings/api-tokens
name: Package and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
